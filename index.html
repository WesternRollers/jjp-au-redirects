<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="refresh" content="0; url=https://janjucpark.com.au">
    <title>Jan Juc Caravan Park</title>
    <script>
        (() => {
            'use strict';

            const destination = new URL('https://janjucpark.com.au');
            destination.search = window.location.search;
            destination.hash = window.location.hash;
            window.location.replace(destination.toString());
        })();
    </script>
</head>
<body>
    <p>Redirecting to Jan Juc Caravan Park.</p>
    <p><a href="https://janjucpark.com.au">Continue to Jan Juc Caravan Park</a></p>
</body>
</html>
